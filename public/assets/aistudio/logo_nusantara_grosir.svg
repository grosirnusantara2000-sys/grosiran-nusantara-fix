<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#163860" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container Box / Shield -->
  <rect x="4" y="4" width="472" height="132" rx="18" fill="url(#bgGrad)" stroke="#1e40af" stroke-width="2" filter="url(#badgeShadow)"/>
  
  <!-- Subtle Grid & Star Accent Behind Icon -->
  <circle cx="70" cy="70" r="50" fill="#1e293b" fill-opacity="0.4" />
  <circle cx="70" cy="70" r="42" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Wholesale Bag / Trolley / Nusantara Emblem -->
  <g transform="translate(36, 36)">
    <!-- Cart Base / Package Box -->
    <path d="M12 20 L24 20 L34 50 L56 50 L64 26 L22 26" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wheels -->
    <circle cx="36" cy="58" r="4.5" fill="#f59e0b" />
    <circle cx="53" cy="58" r="4.5" fill="#f59e0b" />
    <!-- Dynamic Package / Cargo Stack inside -->
    <rect x="26" y="10" width="18" height="15" rx="3" fill="url(#goldGrad)" />
    <path d="M26 18 L44 18" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M35 10 L35 25" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="40" y="5" width="16" height="18" rx="3" fill="#38bdf8" fill-opacity="0.9" />
    <path d="M40 14 L56 14" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M48 5 L48 23" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
    <!-- Star Sparkle -->
    <path d="M60 10 L62 14 L66 16 L62 18 L60 22 L58 18 L54 16 L58 14 Z" fill="#fde047" />
  </g>

  <!-- Typography: GROSIR NUSANTARA / NUSANTARA GROSIR -->
  <text x="135" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">
    NUSANTARA
  </text>
  <text x="306" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)" letter-spacing="-0.5">
    GROSIR
  </text>

  <!-- Tagline Pill Banner -->
  <rect x="135" y="66" width="315" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
  <text x="144" y="82" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#fde047" letter-spacing="0.4">
    BELANJA GROSIR &amp; ECERAN LEBIH MUDAH
  </text>

  <!-- Dual Centers Ribbon -->
  <g transform="translate(135, 100)">
    <circle cx="5" cy="11" r="3" fill="#38bdf8" />
    <text x="14" y="15" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" fill="#94a3b8">
      Tanah Abang (Jakarta)
    </text>

    <text x="138" y="15" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#f59e0b">
      •
    </text>

    <circle cx="154" cy="11" r="3" fill="#f97316" />
    <text x="163" y="15" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" fill="#94a3b8">
      Pasar Aur Kuning (Bukittinggi)
    </text>
  </g>
</svg>
